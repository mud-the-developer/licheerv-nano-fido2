<text x="210" y="165.7" text-anchor="middle" dominant-baseline="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="18"><tspan x="210" y="165.7">Before first setup</tspan><tspan x="210" y="190">secure SSH / root access</tspan><tspan x="210" y="214.29999999999998">keep another login method</tspan></text>
