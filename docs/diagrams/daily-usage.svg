<title>daily-usage</title>
<metadata>Scene created and animated via @excalimate/mcp-server 0.5.0 over MCP; static SVG snapshot rendered locally from the returned scene.</metadata>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="1400" height="920" fill="#ffffff"/>
<text x="700" y="52.5" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="30"><tspan x="700" y="52.5">Operator workflow - first setup, daily unlock, browser use and lock</tspan></text>
